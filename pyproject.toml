[project]
name = "volatility-forecasting"
version = "0.1.0"
description = "Research code for Volatility-Forecasting"
requires-python = ">=3.11"
dependencies = [
    'numpy>=1.24',
    'pandas>=2.0',
    'scipy>=1.11',
    'statsmodels>=0.14',
    'arch>=6.2',
    'scikit-learn>=1.3',
    'xgboost>=2.0',
    'lightgbm>=4.1',
    'yfinance>=0.2.36',
    'joblib>=1.3',
    'matplotlib>=3.7',
    'seaborn>=0.13'
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
